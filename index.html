<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live streaming radio player">
    <title>Island Radio - Live Stream</title>

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="radio-container">
        <div class="radio-player">
            <!-- Header Section -->
            <div class="player-header">
                <div class="station-logo">
                    <svg class="radio-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12c0 1.1.89 2 2 2h16c1.11 0 2-.9 2-2V8c0-1.11-.89-2-2-2H8.3l8.26-3.34L15.88 1 3.24 6.15zM7 20c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-8h-2v-2h-2v2H4V8h16v4z"/>
                    </svg>
                    <h1>Island Radio</h1>
                </div>
                <div class="connection-status" id="connectionStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">Ready</span>
                </div>
            </div>

            <!-- Now Playing Section -->
            <div class="now-playing-section" id="nowPlayingSection">
                <div class="now-playing-label">Now Playing</div>
                <div class="now-playing-content">
                    <div class="metadata-display" id="metadataDisplay">
                        <div class="song-title" id="songTitle">Ready to play</div>
                        <div class="artist-name" id="artistName">Press play to start streaming</div>
                    </div>
                </div>
            </div>

            <!-- Hidden Video.js Audio Player -->
            <audio id="radioPlayer" class="video-js vjs-default-skin"></audio>

            <!-- Custom Player Controls -->
            <div class="player-controls">
                <!-- Play/Pause Button -->
                <button class="control-btn play-pause-btn" id="playPauseBtn" aria-label="Play">
                    <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                    <div class="loading-spinner" style="display: none;">
                        <div class="spinner"></div>
                    </div>
                </button>

                <!-- Volume Control -->
                <div class="volume-control">
                    <button class="control-btn volume-btn" id="volumeBtn" aria-label="Mute">
                        <svg class="volume-high-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                        <svg class="volume-muted-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                        </svg>
                    </button>
                    <input type="range" class="volume-slider" id="volumeSlider"
                           min="0" max="100" value="70" aria-label="Volume">
                    <span class="volume-value" id="volumeValue">70%</span>
                </div>
            </div>

            <!-- Error Message Display -->
            <div class="error-message" id="errorMessage" style="display: none;">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                <div>
                    <div class="error-title">Connection Error</div>
                    <div class="error-text" id="errorText"></div>
                </div>
            </div>

            <!-- Share Button (Bonus Feature) -->
            <div class="share-section" id="shareSection" style="display: none;">
                <button class="share-btn" id="shareBtn" aria-label="Share now playing">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
                    </svg>
                    Share
                </button>
            </div>

            <!-- Footer -->
            <div class="player-footer">
                <div class="keyboard-shortcuts-hint">
                    💡 <strong>Keyboard shortcuts:</strong> Space = Play/Pause • ↑↓ = Volume
                </div>
            </div>
        </div>
    </div>

    <!-- Video.js Library -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <!-- Custom Player Script -->
    <script src="player.js"></script>
</body>
</html>
